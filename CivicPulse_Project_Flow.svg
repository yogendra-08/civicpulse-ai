<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="white"/>
<text x="800" y="50" text-anchor="middle" font-size="36" font-family="Arial" font-weight="bold">CivicPulse AI - Project Flow</text>

<g font-family="Arial">
  <rect x="40" y="120" width="200" height="280" rx="12" fill="#eaf2ff" stroke="#2563eb"/>
  <text x="140" y="155" text-anchor="middle" font-size="20" font-weight="bold">Citizen</text>
  <text x="60" y="200">• Register/Login</text>
  <text x="60" y="235">• Submit Complaint</text>
  <text x="60" y="270">• Upload Image</text>
  <text x="60" y="305">• Track Status</text>
  <text x="60" y="340">• Give Feedback</text>

  <rect x="300" y="120" width="220" height="280" rx="12" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="410" y="155" text-anchor="middle" font-size="20" font-weight="bold">Complaint Intake</text>
  <text x="320" y="210">• Description</text>
  <text x="320" y="245">• Location</text>
  <text x="320" y="280">• Photo Upload</text>
  <text x="320" y="315">• Complaint ID</text>

  <rect x="580" y="120" width="240" height="280" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text x="700" y="155" text-anchor="middle" font-size="20" font-weight="bold">AI Analysis</text>
  <text x="600" y="200">• Category Detection</text>
  <text x="600" y="235">• Severity Detection</text>
  <text x="600" y="270">• Image Analysis</text>
  <text x="600" y="305">• Department Mapping</text>
  <text x="600" y="340">• Officer Suggestion</text>

  <rect x="880" y="120" width="240" height="280" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="1000" y="155" text-anchor="middle" font-size="20" font-weight="bold">Routing & Assignment</text>
  <text x="900" y="210">• Assign Department</text>
  <text x="900" y="245">• Assign Officer</text>
  <text x="900" y="280">• Notifications</text>
  <text x="900" y="315">• Dashboard Entry</text>

  <rect x="1180" y="120" width="220" height="280" rx="12" fill="#ecfeff" stroke="#0891b2"/>
  <text x="1290" y="155" text-anchor="middle" font-size="20" font-weight="bold">Officer Action</text>
  <text x="1200" y="210">• Review Complaint</text>
  <text x="1200" y="245">• Update Status</text>
  <text x="1200" y="280">• Upload Evidence</text>
  <text x="1200" y="315">• Resolve Issue</text>

  <rect x="500" y="500" width="600" height="120" rx="12" fill="#f8fafc" stroke="#475569"/>
  <text x="800" y="535" text-anchor="middle" font-size="22" font-weight="bold">Complaint Lifecycle</text>
  <text x="550" y="585">Submitted → Under Review → Assigned → In Progress → Resolved → Closed</text>

  <rect x="1180" y="500" width="260" height="180" rx="12" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="1310" y="535" text-anchor="middle" font-size="20" font-weight="bold">Admin Dashboard</text>
  <text x="1200" y="575">• Total Complaints</text>
  <text x="1200" y="605">• Ward Analytics</text>
  <text x="1200" y="635">• Department Performance</text>
  <text x="1200" y="665">• Reports & Trends</text>

  <line x1="240" y1="260" x2="300" y2="260" stroke="black" stroke-width="2"/>
  <line x1="520" y1="260" x2="580" y2="260" stroke="black" stroke-width="2"/>
  <line x1="820" y1="260" x2="880" y2="260" stroke="black" stroke-width="2"/>
  <line x1="1120" y1="260" x2="1180" y2="260" stroke="black" stroke-width="2"/>

  <text x="800" y="780" text-anchor="middle" font-size="18">
  Backend: React + Node.js + PostgreSQL + AI Service + Notifications + JWT Auth
  </text>
</g>
</svg>